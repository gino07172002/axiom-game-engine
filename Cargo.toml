[workspace]
members = ["crates/axiom-combat", "crates/axiom-core", "crates/axiom-fps", "crates/axiom-rts", "crates/axiom-action", "crates/axiom-animation", "crates/axiom-runtime", "crates/axiom-cli"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
axiom-combat = { path = "crates/axiom-combat" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam = { version = "0.29", features = ["serde"] }
axiom-core = { path = "crates/axiom-core" }
axiom-fps = { path = "crates/axiom-fps" }
axiom-rts = { path = "crates/axiom-rts" }
axiom-action = { path = "crates/axiom-action" }
axiom-animation = { path = "crates/axiom-animation" }
axiom-runtime = { path = "crates/axiom-runtime" }

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1

