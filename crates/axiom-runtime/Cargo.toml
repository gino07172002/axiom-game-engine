[package]
name = "axiom-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axiom-combat.workspace = true
axiom-core.workspace = true
axiom-fps.workspace = true
axiom-rts.workspace = true
axiom-action.workspace = true
axiom-animation.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
glam.workspace = true
rapier3d = { version = "0.23", features = ["simd-stable"] }
wgpu = "24"
naga = { version = "24", features = ["wgsl-in"] }
winit = "0.30"
egui = "0.31"
# Already in the tree through egui's font stack; checks content fonts before egui sees them.
ttf-parser = "0.25"
egui-wgpu = "0.31"
egui-winit = "0.31"
egui_dock = "=0.16.0"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
png = "0.17"
sha2 = "0.10"
# Fast fixed-seed content fingerprint of audio files (spatial_audio.rs). Zlib; already built
# for hashbrown, so no new download or build time.
foldhash = "0.2"
# Ogg Vorbis decoding of file-backed audio clips (pure Rust, MIT OR Apache-2.0; default
# feature `ogg` = the Ogg container, no async).
lewton = "0.10"

[dev-dependencies]
# Writer tests hold the SQLite write lock from a second connection. The same version and
# features axiom-core already builds: no new crate in the build.
rusqlite = { version = "0.32", features = ["bundled"] }


# Per-process video memory for the editor status bar (vram.rs; the crate is already built for
# wgpu-hal's D3D12 backend) and XInput gamepads (gamepad.rs).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", default-features = false, features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Storage_FileSystem", "Win32_UI_Input_XboxController"] }

