name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # The workspace pins stable-x86_64-pc-windows-gnu (rust-toolchain.toml);
    # bundled SQLite needs a MinGW C compiler, provided here by MSYS2.
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Put MinGW on PATH
        shell: pwsh
        run: echo "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" >> $env:GITHUB_PATH

      - name: Install toolchain from rust-toolchain.toml
        shell: pwsh
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
